<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js" defer></script>
</head>
<body>
<div class="container">
    <form class="my-form">
        <h2 class="form-title">Форма</h2>

        <div class="form-group">
            <label class="form-label" for="name">Имя:</label>
            <input class="form-input input-name" type="text" name="name" id="name">
        </div>
        <div class="form-group">
            <label class="form-label" for="surname">Фамилия:</label>
            <input class="form-input input-surname" type="text" name="surname" id="surname">
        </div>
        <div class="form-group">
            <label class="form-label" for="phone">Телефон:</label>
            <input class="form-input" type="tel" name="phone" id="phone">
        </div>
        <div class="form-group">
            <label class="form-label" for="mail">email:</label>
            <input class="form-input" type="mail" name="mail" id="mail">
        </div>
        <div class="form-group">
            <label class="form-label" for="file">Файл:</label>
            <input class="form-input" type="file" name="file" id="file">
        </div>
        <div class="form-group">
            <label class="form-label" for="count">Кол-во:</label>
            <input class="form-input input-range" type="range" name="count" id="count">
        </div>
        <div class="form-group">
            <label class="form-label" for="description">Описание:</label>
            <textarea class="form-input"  name="description" id="description">

            </textarea>
        </div>
        <div class="form-group">
            <label class="form-label-flex">
                <input name="age" type="checkbox" value="yes">Есть 18?
            </label>
        </div>
        <fieldset class="form-group fieldset-radio">
            <label class="form-label-flex">
                <input name="color" type="checkbox" value="red">Красный
            </label>

            <label>
                <input name="color" type="checkbox" value="green">Зеленый
            </label>

            <label>
                <input name="color" type="checkbox" value="orange"> Оранжевый
            </label>

            <label>
                <input name="color" type="checkbox" value="yellow">Желтый
            </label>
        </fieldset>
        <div  class="form-group">
            <label class="form-label" for ='description'>Размер</label>
            <select class="form-input" name="size">
                <option value="xs">XS</option>
                <option value="s">S</option>
                <option value="m">M</option>
                <option value="l">L</option>
                <option value="xl">XL</option>
                <option value="xll">XLL</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary mr-3">Добавить</button>
        <button type="button" class="btn btn-danger btn-reset">Сброс</button>
        
    </form>
</div>
</body>
</html>
