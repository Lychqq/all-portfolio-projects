[project]
name = "voice-assisten"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
    "pydub>=0.25.1",
    "python-multipart>=0.0.32",
    "speechrecognition>=3.17.0",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

